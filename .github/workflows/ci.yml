on:
  push:
  pull_request:

name: Continuous integration

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.85.0
          - stable
          - beta
          - nightly

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-${{ matrix.rust }}

      - name: cargo build
        if: ${{ matrix.rust != 'nightly' }}
        run: cargo build

      - name: cargo build (all features)
        if: ${{ matrix.rust == 'nightly' }}
        run: cargo build --all-features

      - name: cargo test
        run: cargo test

      - name: cargo build (wasm32, no default features, lib only)
        run: cargo build -p onenote_parser --target wasm32-unknown-unknown --no-default-features --lib

      - name: cargo fmt
        if: ${{ matrix.rust == 'stable' }}
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy

      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2

  # NativeFs has Windows-specific path handling (verbatim `\\?\` paths, drive
  # prefixes) that the Linux job above never compiles or runs.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-windows-stable

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy
